<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>String &amp; Pulley Logo Tool</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        /* ===== ULTRALIGHT HTML-ENERGY NATIVE THEMES ===== */
        :root {
            /* Light Theme (Default) */
            --bg-body: #ffffff;
            --bg-sidebar: #f5f5f5;
            --bg-card: #ffffff;
            --bg-canvas: #fafafa;
            --text-main: #111111;
            --text-muted: #666666;
            --border: #cccccc;
            --border-active: #000000;
            --btn-bg: #ffffff;
            --btn-text: #111111;
            --btn-hover-bg: #111111;
            --btn-hover-text: #ffffff;
            --grid-color: rgba(0, 0, 0, 0.06);
            --shape-fill: #000000;
            --guide-unselected: rgba(220, 50, 47, 0.8);
            --guide-selected: #0066cc;
            --snap-center: #008800;
            --snap-edge: #0088cc;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* Dark Theme */
                --bg-body: #111111;
                --bg-sidebar: #181818;
                --bg-card: #222222;
                --bg-canvas: #141414;
                --text-main: #eeeeee;
                --text-muted: #888888;
                --border: #333333;
                --border-active: #ffffff;
                --btn-bg: #222222;
                --btn-text: #eeeeee;
                --btn-hover-bg: #eeeeee;
                --btn-hover-text: #111111;
                --grid-color: rgba(255, 255, 255, 0.06);
                --shape-fill: #ffffff;
                --guide-unselected: rgba(255, 85, 85, 0.85);
                --guide-selected: #3399ff;
                --snap-center: #44bb44;
                --snap-edge: #33ccff;
            }
        }

        html, body {
            height: 100%;
            height: 100dvh;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            display: flex;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 210px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-shrink: 0;
        }

        .controls {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .controls::-webkit-scrollbar { width: 3px; }
        .controls::-webkit-scrollbar-thumb { background: var(--border); }

        /* ===== PULLEY NODE CARDS ===== */
        .node-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            font-size: 11px;
            user-select: none;
            transition: border-color 0.15s, outline 0.15s;
        }

        .drag-handle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            color: var(--text-muted);
            padding: 2px 3px;
            border-radius: 2px;
            user-select: none;
            touch-action: none;
            transition: color 0.1s, background 0.1s;
        }

        .drag-handle:hover {
            color: var(--text-main);
            background: rgba(128, 128, 128, 0.15);
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .node-card.selected {
            border-color: var(--border-active);
            outline: 1px solid var(--border-active);
        }

        .node-card.dragging { opacity: 0.3; }
        .node-card.drag-over::after,
        .node-card.drag-over-first::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--border-active);
            pointer-events: none;
            z-index: 1;
        }
        .node-card.drag-over::after { bottom: -5px; }
        .node-card.drag-over-first::before { top: -5px; }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        /* ===== ULTRALIGHT HTML NATIVE BUTTONS ===== */
        button {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid var(--border);
            padding: 5px 8px;
            font-size: 10px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.1s, color 0.1s;
        }

        button:hover {
            background: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }

        button:active {
            opacity: 0.8;
        }

        .btn-del {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 2px 4px;
            font-size: 10px;
        }
        .btn-del:hover {
            background: none;
            color: #ff3333;
        }

        /* Minimalist Side Toggle Tile */
        .side-toggle-minimal {
            display: inline-flex;
            border: 1px solid var(--border);
            background: var(--bg-card);
            padding: 1px;
            gap: 1px;
        }

        .side-tile {
            border: none;
            padding: 2px 6px;
            font-size: 10px;
            font-family: inherit;
            font-weight: bold;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            line-height: 1.2;
            transition: background 0.1s, color 0.1s;
            user-select: none;
        }

        .side-tile:hover {
            color: var(--text-main);
            background: rgba(128, 128, 128, 0.15);
        }

        .side-tile.active {
            background: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            accent-color: var(--text-main);
            cursor: pointer;
        }

        .empty-msg {
            text-align: center;
            padding: 16px 8px;
            font-size: 10px;
            color: var(--text-muted);
            border: 1px dashed var(--border);
            line-height: 1.5;
        }

        /* ===== SIDEBAR FOOTER ===== */
        .footer {
            padding: 8px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .btn-block {
            width: 100%;
        }

        /* ===== CANVAS AREA ===== */
        .canvas-area {
            flex: 1;
            display: flex;
            position: relative;
            background-color: var(--bg-canvas);
            overflow: hidden;
            min-height: 0;
            min-width: 0;
        }

        .canvas-wrap {
            width: 100%;
            height: 100%;
            position: relative;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ===== FLOATING TOOLBAR ===== */
        .toolbar {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 2px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 2px;
            z-index: 10;
        }

        .toolbar button {
            border: none;
            padding: 4px 8px;
            font-size: 11px;
        }

        .toolbar button:hover {
            background: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }


        /* ===== MOBILE RESPONSIVE ===== */
        @media (max-width: 600px) {
            body {
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
                min-height: -webkit-fill-available;
            }

            .sidebar {
                width: 100%;
                height: auto;
                max-height: 45vh;
                max-height: 45dvh;
                flex-direction: column;
                border-right: none;
                border-top: 1px solid var(--border);
                order: 1;
                flex-shrink: 0;
            }

            .canvas-area {
                order: 0;
                flex: 1;
                min-height: 0;
            }

            .controls {
                overflow-x: auto;
                overflow-y: hidden;
                flex-direction: row;
                align-items: stretch;
            }

            .controls::-webkit-scrollbar { height: 3px; width: auto; }

            #nodeList {
                flex-direction: row !important;
            }

            .node-card {
                min-width: 170px;
                flex-shrink: 0;
            }

            .node-card.drag-over::after,
            .node-card.drag-over-first::before {
                top: 0;
                bottom: 0;
                left: auto;
                right: auto;
                width: 2px;
                height: auto;
            }
            .node-card.drag-over::after { right: -5px; bottom: 0; }
            .node-card.drag-over-first::before { left: -5px; top: 0; }

            .footer {
                flex-direction: row;
                border-top: 1px solid var(--border);
                align-items: center;
                padding-bottom: max(8px, env(safe-area-inset-bottom));
                padding-left: max(8px, env(safe-area-inset-left));
                padding-right: max(8px, env(safe-area-inset-right));
            }

            .footer-grid {
                grid-template-columns: auto auto;
            }

            .btn-block {
                width: auto;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <!-- Controls Container -->
        <div class="controls">
            <div id="nodeList" style="display: flex; flex-direction: column; gap: 8px;"></div>

            <button class="btn-block" id="addBtn">+ Add Pulley</button>
        </div>

        <!-- Sidebar Footer -->
        <div class="footer">
            <div class="footer-grid">
                <button id="saveBtn" title="Save Pulley System (JSON)">Save</button>
                <button id="importBtn" title="Import Pulley System (JSON)">Import</button>
            </div>
            <button class="btn-block" id="exportBtn">Export SVG</button>
            <input type="file" id="importFileInput" accept=".json" style="display: none;">
        </div>
    </div>

    <!-- Main Canvas Area -->
    <div class="canvas-area">
        <!-- Canvas Toolbar -->
        <div class="toolbar">
            <button id="zoomOutBtn" title="Zoom Out (-)">-</button>
            <button id="zoomResetBtn" title="Reset Zoom &amp; Pan" style="min-width: 48px;">100%</button>
            <button id="zoomInBtn" title="Zoom In (+)">+</button>
            <button id="fitViewBtn" title="Fit View">FIT</button>
        </div>

        <div class="canvas-wrap" id="canvasWrap">
            <canvas id="c"></canvas>
        </div>


    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const nodeList = document.getElementById('nodeList');
        const canvasWrap = document.getElementById('canvasWrap');
        const zoomResetBtn = document.getElementById('zoomResetBtn');

        let nodes = [];
        let nextId = 1;
        let selectedId = null;

        // Node drag state
        let isDragging = false;
        let dragOff = { x: 0, y: 0 };
        let guides = [];

        // Viewport pan & zoom state
        let zoom = 1.0;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let panStart = { x: 0, y: 0 };
        let isSpacePressed = false;
        let initialViewDone = false;

        // ===== SYSTEM THEME DETECTOR =====
        const colorSchemeQuery = window.matchMedia('(prefers-color-scheme: light)');

        function getThemeColors() {
            const isLight = colorSchemeQuery.matches;
            return {
                isLight,
                workspaceBg: isLight ? '#fafafa' : '#141414',
                gridColor: isLight ? 'rgba(0, 0, 0, 0.06)' : 'rgba(255, 255, 255, 0.06)',
                emptyText: isLight ? '#888888' : '#666666',
                shapeFill: isLight ? '#000000' : '#ffffff',
                guideUnselected: isLight ? 'rgba(220, 50, 47, 0.8)' : 'rgba(255, 85, 85, 0.85)',
                guideSelected: isLight ? '#0066cc' : '#3399ff',
                centerDotUnselected: isLight ? 'rgba(220, 50, 47, 0.9)' : 'rgba(255, 85, 85, 0.9)',
                centerDotSelected: isLight ? '#0066cc' : '#3399ff',
                snapGuideCenter: isLight ? '#008800' : '#44bb44',
                snapGuideEdge: isLight ? '#0088cc' : '#33ccff',
            };
        }

        colorSchemeQuery.addEventListener('change', () => { draw(); });

        function getDpr() {
            return window.devicePixelRatio || 1;
        }

        function setupCanvas() {
            const wrapRect = canvasWrap.getBoundingClientRect();
            const dpr = getDpr();
            canvas.width = Math.floor(wrapRect.width * dpr);
            canvas.height = Math.floor(wrapRect.height * dpr);

            if (!initialViewDone && wrapRect.width > 0 && wrapRect.height > 0) {
                fitView();
                initialViewDone = true;
            } else {
                draw();
            }
        }

        function mousePos(e) {
            const r = canvas.getBoundingClientRect();
            const cssX = (e.clientX - r.left);
            const cssY = (e.clientY - r.top);

            return {
                x: (cssX - panX) / zoom,
                y: (cssY - panY) / zoom
            };
        }

        function updateZoomDisplay() {
            if (zoomResetBtn) {
                zoomResetBtn.innerText = Math.round(zoom * 100) + '%';
            }
        }

        function setZoom(newZoom, centerX, centerY) {
            const clampedZoom = Math.min(Math.max(newZoom, 0.15), 10.0);
            if (centerX !== undefined && centerY !== undefined) {
                const worldX = (centerX - panX) / zoom;
                const worldY = (centerY - panY) / zoom;
                zoom = clampedZoom;
                panX = centerX - worldX * zoom;
                panY = centerY - worldY * zoom;
            } else {
                const wrapRect = canvasWrap.getBoundingClientRect();
                const cx = wrapRect.width / 2;
                const cy = wrapRect.height / 2;
                const worldX = (cx - panX) / zoom;
                const worldY = (cy - panY) / zoom;
                zoom = clampedZoom;
                panX = cx - worldX * zoom;
                panY = cy - worldY * zoom;
            }
            updateZoomDisplay();
            draw();
        }

        function fitView() {
            const wrapRect = canvasWrap.getBoundingClientRect();
            const w = wrapRect.width || 800;
            const h = wrapRect.height || 600;

            if (nodes.length === 0) {
                zoom = 1.0;
                panX = 0;
                panY = 0;
                updateZoomDisplay();
                draw();
                return;
            }

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            nodes.forEach(n => {
                if (n.x - n.r < minX) minX = n.x - n.r;
                if (n.x + n.r > maxX) maxX = n.x + n.r;
                if (n.y - n.r < minY) minY = n.y - n.r;
                if (n.y + n.r > maxY) maxY = n.y + n.r;
            });

            const currentW = maxX - minX;
            const currentH = maxY - minY;

            if (currentW > 0 && currentH > 0) {
                const margin = 60;
                const fitScale = Math.min((w - margin * 2) / currentW, (h - margin * 2) / currentH);
                zoom = Math.min(Math.max(fitScale, 0.15), 5.0);
                const centerX = minX + currentW / 2;
                const centerY = minY + currentH / 2;
                panX = (w / 2) - centerX * zoom;
                panY = (h / 2) - centerY * zoom;
            }

            updateZoomDisplay();
            draw();
        }

        const dist = (a, b) => Math.sqrt((b.x - a.x) ** 2 + (b.y - a.y) ** 2);
        const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

        // ===== CORE MATH =====
        function tangentSegment(ax, ay, ar, sideA, bx, by, br, sideB) {
            const dx = bx - ax;
            const dy = by - ay;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d < 1e-6) return null;

            const theta = Math.atan2(dy, dx);

            let phi;
            if (sideA === sideB) {
                const rDiff = ar - br;
                if (d <= Math.abs(rDiff)) return null;
                phi = Math.acos(clamp(rDiff / d, -1, 1));
            } else {
                const rSum = ar + br;
                if (d <= rSum) return null;
                phi = Math.acos(clamp(rSum / d, -1, 1));
            }

            let angle;
            if (sideA === 1) {
                angle = theta + phi;
            } else {
                angle = theta - phi;
            }

            const t1x = ax + ar * Math.cos(angle);
            const t1y = ay + ar * Math.sin(angle);

            let t2x, t2y;
            if (sideA === sideB) {
                t2x = bx + br * Math.cos(angle);
                t2y = by + br * Math.sin(angle);
            } else {
                const angleB = angle + Math.PI;
                t2x = bx + br * Math.cos(angleB);
                t2y = by + br * Math.sin(angleB);
            }

            return { t1: { x: t1x, y: t1y }, t2: { x: t2x, y: t2y }, angle };
        }

        function buildStringPath() {
            if (nodes.length < 2) return null;

            const n = nodes.length;
            const segments = [];

            for (let i = 0; i < n; i++) {
                const a = nodes[i];
                const b = nodes[(i + 1) % n];
                const seg = tangentSegment(a.x, a.y, a.r, a.side, b.x, b.y, b.r, b.side);
                segments.push(seg);
            }

            return segments;
        }

        // ===== UI =====
        window.deleteNode = function(id) {
            nodes = nodes.filter(n => n.id !== id);
            if (selectedId === id) selectedId = null;
            renderUI();
            draw();
        };

        window.setSide = function(id, side) {
            const n = nodes.find(x => x.id === id);
            if (n) { n.side = side; renderUI(); draw(); }
        };

        window.updateR = function(id, val, el) {
            const n = nodes.find(x => x.id === id);
            if (n) {
                n.r = parseFloat(val);
                if (el) {
                    const badge = el.parentElement.querySelector('.val');
                    if (badge) badge.innerText = val;
                }
                draw();
            }
        };

        function renderUI() {
            nodeList.innerHTML = '';

            if (nodes.length === 0) {
                nodeList.innerHTML = '<div class="empty-msg">NO PULLEYS.<br>ADD PULLEYS TO BEGIN.</div>';
                return;
            }

            nodes.forEach((n, i) => {
                const card = document.createElement('div');
                card.className = 'node-card' + (selectedId === n.id ? ' selected' : '');
                card.dataset.index = i;
                card.innerHTML = `
                    <div class="node-header">
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <div class="drag-handle" draggable="true" title="Drag to reorder">
                                <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor">
                                    <circle cx="3" cy="3" r="1.2"/>
                                    <circle cx="7" cy="3" r="1.2"/>
                                    <circle cx="3" cy="7" r="1.2"/>
                                    <circle cx="7" cy="7" r="1.2"/>
                                    <circle cx="3" cy="11" r="1.2"/>
                                    <circle cx="7" cy="11" r="1.2"/>
                                </svg>
                            </div>
                            <div class="side-toggle-minimal">
                                <button type="button" class="side-tile ${n.side === 1 ? 'active' : ''}" onclick="setSide(${n.id}, 1)" title="In (CW)">in</button>
                                <button type="button" class="side-tile ${n.side === -1 ? 'active' : ''}" onclick="setSide(${n.id}, -1)" title="Out (CCW)">out</button>
                            </div>
                        </div>
                        <button type="button" class="btn-del" onclick="deleteNode(${n.id})" title="Delete Pulley">[X]</button>
                    </div>
                    <div>
                        <div class="row"><span>Radius</span><span class="val" style="font-weight: bold;">${n.r}</span></div>
                        <input type="range" min="10" max="300" value="${n.r}" oninput="updateR(${n.id}, this.value, this)">
                    </div>
                `;

                card.addEventListener('mousedown', (e) => {
                    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.closest('button') || e.target.closest('input') || e.target.closest('.drag-handle')) return;
                    selectedId = n.id;
                    renderUI();
                    draw();
                });

                card.addEventListener('dragstart', (e) => {
                    if (!e.target.closest('.drag-handle')) {
                        e.preventDefault();
                        return;
                    }
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', i.toString());
                    if (e.dataTransfer.setDragImage) {
                        e.dataTransfer.setDragImage(card, 10, 10);
                    }
                    requestAnimationFrame(() => card.classList.add('dragging'));
                });

                const clearDragIndicators = () => nodeList.querySelectorAll('.node-card').forEach(c => c.classList.remove('drag-over', 'drag-over-first'));

                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    clearDragIndicators();
                });

                card.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    clearDragIndicators();
                    const rect = card.getBoundingClientRect();
                    const horiz = window.matchMedia('(max-width: 600px)').matches;
                    const before = horiz ? e.clientX < rect.left + rect.width / 2 : e.clientY < rect.top + rect.height / 2;
                    if (before) {
                        const prev = card.previousElementSibling;
                        (prev || card).classList.add(prev ? 'drag-over' : 'drag-over-first');
                    } else {
                        card.classList.add('drag-over');
                    }
                });

                card.addEventListener('dragleave', () => {
                    card.classList.remove('drag-over', 'drag-over-first');
                });

                card.addEventListener('drop', (e) => {
                    e.preventDefault();
                    clearDragIndicators();
                    const fromIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);
                    if (isNaN(fromIndex)) return;
                    let toIndex = parseInt(card.dataset.index, 10);
                    const rect = card.getBoundingClientRect();
                    const horiz = window.matchMedia('(max-width: 600px)').matches;
                    const after = horiz ? e.clientX >= rect.left + rect.width / 2 : e.clientY >= rect.top + rect.height / 2;
                    if (after) toIndex += 1;
                    if (fromIndex === toIndex || fromIndex === toIndex - 1) return;
                    const [moved] = nodes.splice(fromIndex, 1);
                    nodes.splice(fromIndex < toIndex ? toIndex - 1 : toIndex, 0, moved);
                    renderUI();
                    draw();
                });

                nodeList.appendChild(card);
            });
        }

        // ===== DRAWING =====
        function draw() {
            const wrapRect = canvasWrap.getBoundingClientRect();
            const dpr = getDpr();
            const targetW = Math.floor(wrapRect.width * dpr);
            const targetH = Math.floor(wrapRect.height * dpr);

            if (canvas.width !== targetW || canvas.height !== targetH) {
                canvas.width = targetW;
                canvas.height = targetH;
            }

            const cssW = wrapRect.width;
            const cssH = wrapRect.height;
            const colors = getThemeColors();

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.scale(dpr, dpr);

            // Full Canvas Workspace Background
            ctx.fillStyle = colors.workspaceBg;
            ctx.fillRect(0, 0, cssW, cssH);

            // Apply Viewport Pan & Zoom
            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(zoom, zoom);

            // Infinite Dynamic Grid across visible viewport
            const gridSize = 40;
            const startX = Math.floor((-panX / zoom) / gridSize) * gridSize - gridSize;
            const endX = Math.ceil(((cssW - panX) / zoom) / gridSize) * gridSize + gridSize;
            const startY = Math.floor((-panY / zoom) / gridSize) * gridSize - gridSize;
            const endY = Math.ceil(((cssH - panY) / zoom) / gridSize) * gridSize + gridSize;

            ctx.strokeStyle = colors.gridColor;
            ctx.lineWidth = 1 / zoom;
            ctx.beginPath();
            for (let x = startX; x <= endX; x += gridSize) {
                ctx.moveTo(x, startY); ctx.lineTo(x, endY);
            }
            for (let y = startY; y <= endY; y += gridSize) {
                ctx.moveTo(startX, y); ctx.lineTo(endX, y);
            }
            ctx.stroke();

            // Geometry
            if (nodes.length === 0) {
                ctx.save();
                ctx.fillStyle = colors.emptyText;
                ctx.font = `${Math.max(12, 14 / zoom)}px ui-monospace, monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const centerWorldX = (cssW / 2 - panX) / zoom;
                const centerWorldY = (cssH / 2 - panY) / zoom;
                ctx.fillText('Add pulleys and string them together.', centerWorldX, centerWorldY);
                ctx.restore();
            } else if (nodes.length >= 2) {
                const segments = buildStringPath();

                ctx.save();
                ctx.fillStyle = colors.shapeFill;
                ctx.beginPath();

                for (let i = 0; i < nodes.length; i++) {
                    const seg = segments[i];
                    const nextSeg = segments[(i + 1) % nodes.length];
                    const node = nodes[(i + 1) % nodes.length];

                    if (i === 0 && seg) {
                        ctx.moveTo(seg.t1.x, seg.t1.y);
                    }

                    if (seg) {
                        ctx.lineTo(seg.t2.x, seg.t2.y);
                    }

                    if (seg && nextSeg) {
                        const arrivalAngle = Math.atan2(seg.t2.y - node.y, seg.t2.x - node.x);
                        const departAngle = Math.atan2(nextSeg.t1.y - node.y, nextSeg.t1.x - node.x);

                        const ccw = node.side === 1;
                        ctx.arc(node.x, node.y, node.r, arrivalAngle, departAngle, ccw);
                    }
                }

                ctx.closePath();
                ctx.fill();
                ctx.restore();
            } else if (nodes.length === 1) {
                ctx.save();
                ctx.fillStyle = colors.shapeFill;
                ctx.beginPath();
                ctx.arc(nodes[0].x, nodes[0].y, nodes[0].r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Pulley construction guides
            ctx.save();
            nodes.forEach(n => {
                ctx.strokeStyle = selectedId === n.id ? colors.guideSelected : colors.guideUnselected;
                ctx.lineWidth = 1 / zoom;
                ctx.setLineDash([3 / zoom, 3 / zoom]);
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = selectedId === n.id ? colors.centerDotSelected : colors.centerDotUnselected;
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.arc(n.x, n.y, 3 / zoom, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            // Snap alignment guides
            if (guides.length > 0) {
                ctx.save();
                ctx.lineWidth = 1 / zoom;
                ctx.setLineDash([4 / zoom, 4 / zoom]);
                guides.forEach(g => {
                    ctx.strokeStyle = g.color === '#008800' || g.color === '#44bb44' ? colors.snapGuideCenter : colors.snapGuideEdge;
                    ctx.beginPath();
                    ctx.moveTo(g.x1, g.y1);
                    ctx.lineTo(g.x2, g.y2);
                    ctx.stroke();
                });
                ctx.restore();
            }

            ctx.restore(); // Restore pan/zoom transform
            ctx.restore(); // Restore dpr scale
        }

        // ===== SVG EXPORT =====
        function buildSVG() {
            if (nodes.length === 0) return '';

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            nodes.forEach(n => {
                if (n.x - n.r < minX) minX = n.x - n.r;
                if (n.x + n.r > maxX) maxX = n.x + n.r;
                if (n.y - n.r < minY) minY = n.y - n.r;
                if (n.y + n.r > maxY) maxY = n.y + n.r;
            });

            const w = maxX - minX;
            const h = maxY - minY;

            if (w <= 0 || h <= 0) return '';

            let d = '';

            if (nodes.length === 1) {
                const n = nodes[0];
                const cx = n.x, cy = n.y, r = n.r;
                d = `M ${(cx + r).toFixed(2)} ${cy.toFixed(2)} ` +
                    `A ${r.toFixed(2)} ${r.toFixed(2)} 0 1 1 ${(cx - r).toFixed(2)} ${cy.toFixed(2)} ` +
                    `A ${r.toFixed(2)} ${r.toFixed(2)} 0 1 1 ${(cx + r).toFixed(2)} ${cy.toFixed(2)} Z`;
            } else {
                const segments = buildStringPath();
                if (!segments) return '';

                for (let i = 0; i < nodes.length; i++) {
                    const seg = segments[i];
                    const nextSeg = segments[(i + 1) % nodes.length];
                    const node = nodes[(i + 1) % nodes.length];

                    if (i === 0 && seg) {
                        d += `M ${seg.t1.x.toFixed(2)} ${seg.t1.y.toFixed(2)} `;
                    }

                    if (seg) {
                        d += `L ${seg.t2.x.toFixed(2)} ${seg.t2.y.toFixed(2)} `;
                    }

                    if (seg && nextSeg) {
                        const arrivalAngle = Math.atan2(seg.t2.y - node.y, seg.t2.x - node.x);
                        const departAngle = Math.atan2(nextSeg.t1.y - node.y, nextSeg.t1.x - node.x);

                        const sweepCW = node.side === 1;
                        let arcAngle = departAngle - arrivalAngle;

                        if (sweepCW) {
                            if (arcAngle > 0) arcAngle -= 2 * Math.PI;
                        } else {
                            if (arcAngle < 0) arcAngle += 2 * Math.PI;
                        }

                        const largeArc = Math.abs(arcAngle) > Math.PI ? 1 : 0;
                        const sweepFlag = sweepCW ? 0 : 1;

                        const endX = node.x + node.r * Math.cos(departAngle);
                        const endY = node.y + node.r * Math.sin(departAngle);

                        d += `A ${node.r.toFixed(2)} ${node.r.toFixed(2)} 0 ${largeArc} ${sweepFlag} ${endX.toFixed(2)} ${endY.toFixed(2)} `;
                    }
                }

                d += 'Z';
            }

            const minXStr = minX.toFixed(2);
            const minYStr = minY.toFixed(2);
            const wStr = w.toFixed(2);
            const hStr = h.toFixed(2);

            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minXStr} ${minYStr} ${wStr} ${hStr}" width="${wStr}" height="${hStr}">
  <path d="${d}" fill="#000000" fill-rule="evenodd" stroke="none" />
</svg>`;
        }

        function exportSVG() {
            const svg = buildSVG();
            if (!svg) return;
            const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'logo.svg';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ===== SAVE & IMPORT (JSON) =====
        function getTimestamp() {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const dateStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
            const timeStr = `${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
            return `${dateStr}_${timeStr}`;
        }

        function downloadFile(content, fileName, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function savePulleySystem() {
            if (nodes.length === 0) {
                alert('No pulleys to save!');
                return;
            }
            const data = {
                version: 1,
                generator: "String & Pulley Logo Tool",
                timestamp: new Date().toISOString(),
                nodes: nodes.map(n => ({
                    id: n.id,
                    x: n.x,
                    y: n.y,
                    r: n.r,
                    side: n.side
                }))
            };
            const jsonContent = JSON.stringify(data, null, 2);
            const timestamp = getTimestamp();
            downloadFile(jsonContent, `pulley-system_${timestamp}.json`, 'application/json;charset=utf-8');
        }

        function importPulleySystem(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    const parsed = JSON.parse(content);
                    let rawNodes = [];
                    if (Array.isArray(parsed)) {
                        rawNodes = parsed;
                    } else if (parsed && Array.isArray(parsed.nodes)) {
                        rawNodes = parsed.nodes;
                    } else {
                        throw new Error('Expected array of nodes or object with "nodes" property.');
                    }

                    const importedNodes = rawNodes.map((n, idx) => ({
                        id: typeof n.id === 'number' ? n.id : idx + 1,
                        x: typeof n.x === 'number' ? n.x : 400,
                        y: typeof n.y === 'number' ? n.y : 400,
                        r: typeof n.r === 'number' ? Math.max(5, n.r) : 60,
                        side: n.side === -1 ? -1 : 1
                    }));

                    if (importedNodes.length === 0) {
                        alert('No valid pulley nodes found in the JSON file.');
                        return;
                    }

                    nodes = importedNodes;
                    nextId = nodes.reduce((max, n) => Math.max(max, n.id || 0), 0) + 1;
                    selectedId = nodes.length > 0 ? nodes[0].id : null;

                    renderUI();
                    fitView();
                    draw();
                } catch (err) {
                    console.error(err);
                    alert('Failed to import file: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        // ===== INTERACTION =====
        canvasWrap.addEventListener('wheel', (e) => {
            e.preventDefault();
            const r = canvasWrap.getBoundingClientRect();
            const cursorX = e.clientX - r.left;
            const cursorY = e.clientY - r.top;
            const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
            setZoom(zoom * zoomFactor, cursorX, cursorY);
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
                isSpacePressed = true;
                canvasWrap.style.cursor = 'grab';
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                isSpacePressed = false;
                canvasWrap.style.cursor = 'default';
            }
        });

        canvasWrap.addEventListener('mousedown', (e) => {
            const p = mousePos(e);
            let hit = null;

            if (e.button === 0 && !isSpacePressed) {
                for (let i = nodes.length - 1; i >= 0; i--) {
                    if (dist(p, nodes[i]) <= nodes[i].r + (8 / zoom)) {
                        hit = nodes[i];
                        break;
                    }
                }
            }

            if (hit) {
                selectedId = hit.id;
                isDragging = true;
                dragOff.x = p.x - hit.x;
                dragOff.y = p.y - hit.y;
                canvasWrap.style.cursor = 'grabbing';
            } else {
                if (e.button === 0 && !isSpacePressed) {
                    selectedId = null;
                }
                isPanning = true;
                panStart = { x: e.clientX, y: e.clientY };
                canvasWrap.style.cursor = 'grabbing';
            }

            renderUI();
            draw();
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                const dx = e.clientX - panStart.x;
                const dy = e.clientY - panStart.y;
                panX += dx;
                panY += dy;
                panStart = { x: e.clientX, y: e.clientY };
                draw();
                return;
            }

            const p = mousePos(e);
            let hover = false;

            if (!isSpacePressed) {
                for (let i = nodes.length - 1; i >= 0; i--) {
                    if (dist(p, nodes[i]) <= nodes[i].r + (8 / zoom)) {
                        hover = true;
                        break;
                    }
                }
            }

            if (isDragging && selectedId !== null) {
                canvasWrap.style.cursor = 'grabbing';
                const n = nodes.find(x => x.id === selectedId);
                if (n) {
                    const rawX = p.x - dragOff.x;
                    const rawY = p.y - dragOff.y;
                    let sx = rawX, sy = rawY;

                    guides = [];
                    const thresh = 8 / zoom;

                    const wrapRect = canvasWrap.getBoundingClientRect();
                    const viewMinX = (-panX - 100) / zoom;
                    const viewMaxX = (wrapRect.width - panX + 100) / zoom;
                    const viewMinY = (-panY - 100) / zoom;
                    const viewMaxY = (wrapRect.height - panY + 100) / zoom;

                    let bestSnapX = null;
                    let bestSnapY = null;

                    function trySnapX(rawVal, snapVal, guideX, color) {
                        const d = Math.abs(rawVal - snapVal);
                        if (d < thresh && (!bestSnapX || d < bestSnapX.dist)) {
                            const centerVal = rawX + (snapVal - rawVal);
                            bestSnapX = { dist: d, snapVal: centerVal, guides: [{ x1: guideX, y1: viewMinY, x2: guideX, y2: viewMaxY, color }] };
                        } else if (d < thresh && bestSnapX && Math.abs(d - bestSnapX.dist) < 0.5) {
                            bestSnapX.guides.push({ x1: guideX, y1: viewMinY, x2: guideX, y2: viewMaxY, color });
                        }
                    }

                    function trySnapY(rawVal, snapVal, guideY, color) {
                        const d = Math.abs(rawVal - snapVal);
                        if (d < thresh && (!bestSnapY || d < bestSnapY.dist)) {
                            const centerVal = rawY + (snapVal - rawVal);
                            bestSnapY = { dist: d, snapVal: centerVal, guides: [{ x1: viewMinX, y1: guideY, x2: viewMaxX, y2: guideY, color }] };
                        } else if (d < thresh && bestSnapY && Math.abs(d - bestSnapY.dist) < 0.5) {
                            bestSnapY.guides.push({ x1: viewMinX, y1: guideY, x2: guideY, y2: guideY, color });
                        }
                    }

                    const centerColor = '#008800';
                    const edgeColor = '#0088cc';

                    nodes.forEach(o => {
                        if (o.id === n.id) return;
                        trySnapX(rawX, o.x, o.x, centerColor);
                        trySnapX(rawX - n.r, o.x - o.r, o.x - o.r, edgeColor);
                        trySnapX(rawX + n.r, o.x + o.r, o.x + o.r, edgeColor);
                        trySnapX(rawX - n.r, o.x + o.r, o.x + o.r, edgeColor);
                        trySnapX(rawX + n.r, o.x - o.r, o.x - o.r, edgeColor);

                        trySnapY(rawY, o.y, o.y, centerColor);
                        trySnapY(rawY - n.r, o.y - o.r, o.y - o.r, edgeColor);
                        trySnapY(rawY + n.r, o.y + o.r, o.y + o.r, edgeColor);
                        trySnapY(rawY - n.r, o.y + o.r, o.y + o.r, edgeColor);
                        trySnapY(rawY + n.r, o.y - o.r, o.y - o.r, edgeColor);
                    });

                    if (bestSnapX) {
                        sx = bestSnapX.snapVal;
                        guides.push(...bestSnapX.guides);
                    }
                    if (bestSnapY) {
                        sy = bestSnapY.snapVal;
                        guides.push(...bestSnapY.guides);
                    }

                    n.x = Math.round(sx);
                    n.y = Math.round(sy);
                    draw();
                }
            } else {
                canvasWrap.style.cursor = isSpacePressed ? 'grab' : hover ? 'pointer' : 'default';
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            isPanning = false;
            guides = [];
            canvasWrap.style.cursor = isSpacePressed ? 'grab' : 'default';
            draw();
        });

        // ===== CONTROL BUTTON LISTENERS =====
        document.getElementById('addBtn').addEventListener('click', () => {
            const id = nextId++;
            const wrapRect = canvasWrap.getBoundingClientRect();
            const centerWorld = mousePos({
                clientX: wrapRect.left + wrapRect.width / 2,
                clientY: wrapRect.top + wrapRect.height / 2
            });

            const newNode = { id, x: 0, y: 0, r: 60, side: 1 };

            if (nodes.length === 0) {
                newNode.x = Math.round(centerWorld.x);
                newNode.y = Math.round(centerWorld.y);
                nodes.push(newNode);
            } else {
                const targetNode = nodes.find(n => n.id === selectedId) || nodes[nodes.length - 1];
                const targetIdx = nodes.indexOf(targetNode);
                const otherNodes = nodes.filter(n => n.id !== targetNode.id);

                let spawnX, spawnY;

                if (otherNodes.length === 0) {
                    spawnX = Math.round(targetNode.x + targetNode.r + 60 + 20);
                    spawnY = Math.round(targetNode.y);
                } else {
                    let nearestNode = otherNodes[0];
                    let minSq = Infinity;
                    for (const o of otherNodes) {
                        const sq = (o.x - targetNode.x) ** 2 + (o.y - targetNode.y) ** 2;
                        if (sq < minSq) { minSq = sq; nearestNode = o; }
                    }

                    function isPositionValid(px, py) {
                        for (const o of nodes) {
                            const minDist = o.r + 60 + 5;
                            if (Math.hypot(px - o.x, py - o.y) < minDist) return false;
                        }
                        return true;
                    }

                    // 1. Try midpoint
                    const midX = Math.round((targetNode.x + nearestNode.x) / 2);
                    const midY = Math.round((targetNode.y + nearestNode.y) / 2);

                    if (isPositionValid(midX, midY)) {
                        spawnX = midX;
                        spawnY = midY;
                    } else {
                        // 2. Search directions around targetNode for non-colliding position
                        const baseAngle = Math.atan2(nearestNode.y - targetNode.y, nearestNode.x - targetNode.x);
                        const radiusDist = targetNode.r + 60 + 15;
                        let foundPos = null;

                        const anglesToTry = [];
                        for (let i = 0; i < 16; i++) {
                            const step = Math.floor((i + 1) / 2) * (i % 2 === 0 ? 1 : -1);
                            anglesToTry.push(baseAngle + (step * Math.PI / 8));
                        }

                        for (const ang of anglesToTry) {
                            const testX = Math.round(targetNode.x + radiusDist * Math.cos(ang));
                            const testY = Math.round(targetNode.y + radiusDist * Math.sin(ang));
                            if (isPositionValid(testX, testY)) {
                                foundPos = { x: testX, y: testY };
                                break;
                            }
                        }

                        if (foundPos) {
                            spawnX = foundPos.x;
                            spawnY = foundPos.y;
                        } else {
                            spawnX = Math.round(targetNode.x + targetNode.r + 60 + 20);
                            spawnY = Math.round(targetNode.y);
                        }
                    }
                }

                newNode.x = spawnX;
                newNode.y = spawnY;
                newNode.r = 60;
                newNode.side = 1;

                nodes.splice(targetIdx + 1, 0, newNode);
            }

            selectedId = id;
            renderUI();
            draw();
        });

        document.getElementById('zoomInBtn').addEventListener('click', () => setZoom(zoom * 1.25));
        document.getElementById('zoomOutBtn').addEventListener('click', () => setZoom(zoom * 0.8));
        document.getElementById('zoomResetBtn').addEventListener('click', () => setZoom(1.0));
        document.getElementById('fitViewBtn').addEventListener('click', fitView);

        document.getElementById('exportBtn').addEventListener('click', exportSVG);
        document.getElementById('saveBtn').addEventListener('click', savePulleySystem);

        const importFileInput = document.getElementById('importFileInput');
        document.getElementById('importBtn').addEventListener('click', () => {
            importFileInput.value = '';
            importFileInput.click();
        });

        importFileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                importPulleySystem(e.target.files[0]);
            }
        });

        // Canvas drag-and-drop file import
        canvasWrap.addEventListener('dragover', (e) => {
            if (e.dataTransfer.types && (e.dataTransfer.types.includes('Files') || Array.from(e.dataTransfer.types).includes('Files'))) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'copy';
            }
        });

        canvasWrap.addEventListener('drop', (e) => {
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                if (file.name.endsWith('.json')) {
                    e.preventDefault();
                    importPulleySystem(file);
                }
            }
        });

        window.addEventListener('resize', setupCanvas);

        setupCanvas();
        renderUI();
    </script>
</body>
</html>
